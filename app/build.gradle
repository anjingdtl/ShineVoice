import java.util.Locale

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionProperties = new Properties()
def versionFile = file("${rootDir}/version.properties")
if (!versionFile.isFile()) {
    throw new GradleException("Missing canonical version source: ${versionFile.absolutePath}")
}
versionFile.withInputStream { versionProperties.load(it) }
def canonicalVersionName = versionProperties.getProperty('versionName', '').trim()
def canonicalVersionCode = versionProperties.getProperty('versionCode', '').trim()
if (!(canonicalVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("Invalid versionName in version.properties")
}
if (!(canonicalVersionCode ==~ /\d+/) || canonicalVersionCode.toInteger() < 1) {
    throw new GradleException("Invalid versionCode in version.properties")
}

def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains('release')
}
def releaseSigningValues = [
    'SHINEVOICE_RELEASE_STORE_FILE',
    'SHINEVOICE_RELEASE_STORE_PASSWORD',
    'SHINEVOICE_RELEASE_KEY_ALIAS',
    'SHINEVOICE_RELEASE_KEY_PASSWORD',
].collectEntries { name -> [name, System.getenv(name)] }
if (releaseBuildRequested) {
    def missing = releaseSigningValues.findAll { name, value -> value == null || value.trim().isEmpty() }.keySet()
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release signing requires environment variable(s): ${missing.join(', ')}. " +
                "Debug builds do not require release signing secrets."
        )
    }
    def storeFile = file(releaseSigningValues['SHINEVOICE_RELEASE_STORE_FILE'])
    if (!storeFile.isFile()) {
        throw new GradleException("Release signing keystore not found: ${storeFile.absolutePath}")
    }
}

// Standard ZipVoice bundle embedded in the APK (标配内置模型). Staged from
// runtime/zipvoice (git-ignored, produced by scripts/prepare-zipvoice-runtime)
// into src/main/assets/bundled before every build. When runtime/ is absent
// (e.g. CI) the task skips and the APK simply builds without the bundle;
// the app then behaves exactly like the old side-load flow.
def bundledRuntimeSrc = file("${rootDir}/runtime/zipvoice")
def bundledAssetsDst = file('src/main/assets/bundled')

tasks.register('prepareBundledModelAssets', Copy) {
    onlyIf { bundledRuntimeSrc.isDirectory() }
    from(bundledRuntimeSrc) {
        include 'model-manifest.properties', 'vocos_24khz.onnx',
                'sherpa-onnx-zipvoice-distill-int8-zh-en-emilia/**'
        exclude 'sherpa-onnx-zipvoice-distill-int8-zh-en-emilia/test_wavs/**'
        into 'models/zipvoice'
    }
    from(file("${bundledRuntimeSrc}/reference/default")) {
        include 'reference.wav'
        into 'voices/default'
    }
    into bundledAssetsDst
}

android {
    namespace 'com.shinevoice'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shinevoice'
        minSdk 24
        targetSdk 36
        versionCode canonicalVersionCode.toInteger()
        versionName canonicalVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true

        // The emulator currently available is x86_64. arm64-v8a keeps the
        // same APK usable on the intended CPU-only Android phones.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseBuildRequested) {
                storeFile file(releaseSigningValues['SHINEVOICE_RELEASE_STORE_FILE'])
                storePassword releaseSigningValues['SHINEVOICE_RELEASE_STORE_PASSWORD']
                keyAlias releaseSigningValues['SHINEVOICE_RELEASE_KEY_ALIAS']
                keyPassword releaseSigningValues['SHINEVOICE_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    // Downloaded by scripts/fetch-sherpa-onnx.ps1; deliberately ignored by Git.
    implementation files('../third_party/sherpa-onnx-1.13.8.aar')

    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'androidx.core:core-ktx:1.16.0'

    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.sqlite:sqlite-framework:2.4.0'
}

// Stage the bundled model into assets before compiling, so assembleDebug /
// assembleRelease always embed the latest local bundle.
tasks.named('preBuild') {
    dependsOn 'prepareBundledModelAssets'
}
